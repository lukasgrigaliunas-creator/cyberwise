:root{
  --bg:#FDFDFC;
  --ink:#1A1D23;
  --ink-soft:#4E5561;
  --ink-faint:#9AA0AC;
  --line:#E8E9EC;

  --fall:#BC4040;

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:15px;
  line-height:1.6;
  padding-bottom:90px;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.wrap{max-width:880px;margin:0 auto;padding:0 28px}

/* ---------- Masthead ---------- */
header{border-bottom:1px solid var(--line)}
.mast{
  max-width:880px;margin:0 auto;padding:30px 28px 22px;
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.mast h1{
  font-size:16px;font-weight:700;letter-spacing:.18em;
}
.mast h1 em{font-style:normal;color:var(--accent)}
.weekbox{display:flex;align-items:baseline;gap:10px}
.weekbox .lbl{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-faint);
}
.weekbox .val{
  font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;color:var(--ink);
  outline:none;border-bottom:1px dashed var(--line);padding:1px 2px;
}
.weekbox .val:focus{border-bottom-color:var(--accent);background:var(--accent-soft)}

/* ---------- Sections ---------- */
section.block{padding:26px 0 6px;border-top:1px solid var(--line);margin-top:22px}
section.block:first-of-type{border-top:none;margin-top:4px}
section.block.omitted .stories,
section.block.omitted .connective,
section.block.omitted .addstory{display:none}
section.block.omitted .sechead{opacity:.4}
.sechead{display:flex;align-items:baseline;gap:12px}
.secnum{
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;
  color:var(--accent);letter-spacing:.05em;
}
.sechead h2{font-size:17px;font-weight:650;letter-spacing:-.01em;flex:1}
.omit-toggle{
  display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;
  font-size:10px;color:var(--ink-faint);cursor:pointer;user-select:none;letter-spacing:.03em;
}
.omit-toggle input{accent-color:var(--accent);cursor:pointer}
.stories{margin-top:6px}
.story{position:relative;padding:16px 34px 16px 0;border-top:1px solid var(--line-soft)}
.story:first-child{border-top:none}
.story .headline{font-weight:600;font-size:14.5px;outline:none;margin-bottom:5px;letter-spacing:-.005em}
.story .body{font-size:13.5px;color:var(--ink-soft);outline:none}
.story .headline:focus,.story .body:focus,.connective p:focus{background:var(--accent-soft);border-radius:4px}
.story .meta{
  font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-faint);
  margin-top:8px;letter-spacing:.04em;text-transform:uppercase;outline:none;
}
.story .del{
  position:absolute;top:14px;right:0;border:none;background:none;color:var(--ink-faint);
  font-size:15px;line-height:1;cursor:pointer;padding:3px 6px;border-radius:5px;opacity:0;transition:opacity .15s;
}
.story:hover .del{opacity:1}
.story .del:hover{color:var(--fall)}
.story.sample .headline::after{
  content:'sample';font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;
  color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:1px 6px;
  margin-left:9px;vertical-align:2px;font-weight:400;
}
.addstory{
  font-family:'IBM Plex Mono',monospace;font-size:11px;
  background:none;border:none;color:var(--ink-faint);
  padding:8px 0;cursor:pointer;text-align:left;
}
.addstory:hover{color:var(--accent)}
.connective{margin-top:6px;padding:12px 0 8px;border-top:1px solid var(--line-soft)}
.connective .lbl{
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.16em;
  color:var(--accent);text-transform:uppercase;display:block;margin-bottom:4px;
}
.connective p{font-style:italic;font-size:13.5px;color:var(--ink-soft);outline:none}

/* ---------- Toolbar ---------- */
.toolbar{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  display:flex;gap:4px;background:#fff;border:1px solid var(--line);
  border-radius:99px;padding:6px;box-shadow:0 6px 24px rgba(26,29,35,.10);z-index:50;
}
.toolbar button{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.03em;
  border:none;border-radius:99px;padding:7px 16px;cursor:pointer;
  background:none;color:var(--ink-soft);
}
.toolbar button:hover{background:var(--line-soft);color:var(--ink)}
.toolbar button.primary{background:var(--ink);color:#fff}
.toolbar button.primary:hover{background:#33373F}

@media (max-width:760px){
  .tickers{grid-template-columns:repeat(2,1fr);gap:14px 0}
  .tk{border-left:none;padding-left:0;padding-right:14px}
}
@media (max-width:640px){
  .mast{flex-direction:column;gap:6px}
}
@media print{
  .toolbar,.addstory,.story .del,.omit-toggle,#refreshBtn{display:none!important}
  section.block.omitted{display:none}
  .story.sample .headline::after{display:none}
  body{padding-bottom:0}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important}
}

/* ---------- Weekly Earnings Report ---------- */
.earn-scope{
  font-size:13px;color:var(--ink-soft);margin-top:6px;outline:none;
}
.earn-scope strong{color:var(--ink);font-weight:600}
.earn-snapshot{
  margin-top:16px;display:grid;grid-template-columns:repeat(5,1fr);
  border:1px solid var(--line);border-radius:8px;overflow:hidden;
}
.earn-snap-cell{padding:12px 14px;border-left:1px solid var(--line-soft);background:var(--accent-soft)}
.earn-snap-cell:first-child{border-left:none}
.earn-snap-cell .k{
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:5px;display:block;
}
.earn-snap-cell .v{font-size:13px;font-weight:600;color:var(--ink);outline:none;line-height:1.35}
.earn-cards{margin-top:20px;display:flex;flex-direction:column;gap:14px}
.earn-card{border:1px solid var(--line);border-radius:8px;padding:16px 18px;position:relative}
.earn-card .del{
  position:absolute;top:12px;right:12px;border:none;background:none;color:var(--ink-faint);
  font-size:15px;line-height:1;cursor:pointer;padding:3px 6px;border-radius:5px;opacity:0;transition:opacity .15s;
}
.earn-card:hover .del{opacity:1}
.earn-card .del:hover{color:var(--fall)}
.earn-card.sample .earn-meta::after{
  content:'sample';font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;
  color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:1px 6px;
  margin-left:9px;vertical-align:2px;font-weight:400;
}
.earn-meta{
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink);font-weight:600;
  letter-spacing:.01em;outline:none;padding-right:24px;
}
.earn-meta .sep{color:var(--ink-faint);font-weight:400;margin:0 6px}
.kpi-row{
  margin-top:12px;display:grid;grid-template-columns:repeat(5,1fr);gap:0;
  border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
}
.kpi{padding:9px 10px 9px 0;border-left:1px solid var(--line-soft)}
.kpi:first-child{border-left:none;padding-left:0}
.kpi .k{
  font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-faint);display:block;margin-bottom:4px;
}
.kpi .v{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--ink);outline:none}
.kpi .v.na{color:var(--ink-faint);font-weight:500}
.earn-takeaway,.earn-strategic{margin-top:10px}
.earn-takeaway .lbl,.earn-strategic .lbl{
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);display:block;margin-bottom:5px;
}
.earn-takeaway ul,.earn-strategic ul{padding-left:16px}
.earn-takeaway li,.earn-strategic li{font-size:13px;color:var(--ink-soft);outline:none;margin-bottom:2px}
.earn-watch{
  margin-top:10px;padding-top:9px;border-top:1px dashed var(--line-soft);
  font-size:12.5px;color:var(--ink-soft);outline:none;
}
.earn-watch strong{color:var(--ink);font-weight:600}
.addearncard{
  font-family:'IBM Plex Mono',monospace;font-size:11px;
  background:none;border:none;color:var(--ink-faint);
  padding:8px 0;cursor:pointer;text-align:left;
}
.addearncard:hover{color:var(--accent)}
/* ============================================================
   v2 ADDITIONS
   ============================================================ */

/* --- Masthead issue stats --- */
.issuestat{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-faint);margin-top:2px;
}

/* --- Sticky section nav --- */
.secnav{
  position:sticky;top:0;z-index:40;
  background:rgba(253,253,252,.90);backdrop-filter:saturate(180%) blur(10px);
  border-bottom:1px solid var(--line);
}
.secnav-inner{
  max-width:880px;margin:0 auto;padding:0 28px;
  display:flex;gap:0;overflow-x:auto;scrollbar-width:none;
}
.secnav-inner::-webkit-scrollbar{display:none}
.secnav a{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-faint);text-decoration:none;
  padding:11px 13px 9px;white-space:nowrap;border-bottom:2px solid transparent;
  transition:color .15s,border-color .15s;
}
.secnav a:first-child{padding-left:0}
.secnav a:hover{color:var(--ink)}
.secnav a.active{color:var(--accent);border-bottom-color:var(--accent)}
.secnav a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:3px}

/* --- Section header stat --- */
.sec-stat{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.07em;
  color:var(--ink-faint);white-space:nowrap;
}
.sec-stat b{color:var(--ink-soft);font-weight:600}

/* --- Story row affordance --- */
.story{
  padding-left:14px;margin-left:-14px;border-radius:0 4px 4px 0;
  transition:box-shadow .15s,background .15s;
}
.story:hover{box-shadow:inset 2px 0 0 var(--accent);background:linear-gradient(90deg,var(--accent-soft) 0%,transparent 55%)}

/* --- Figure emphasis --- */
.num{
  font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:600;
  color:var(--ink);font-size:.93em;letter-spacing:-.01em;
}

/* --- Why it matters block --- */
.story .why{
  margin-top:7px;padding-left:11px;border-left:2px solid var(--accent-soft);
  outline:none;
}
.story .why strong{color:var(--accent);font-weight:600}
.story .seg{margin-top:6px;outline:none}

/* --- Meta line --- */
.story .meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.favi{width:13px;height:13px;border-radius:2px;flex:none;opacity:.85}
.also{
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.06em;
  color:var(--ink-faint);background:var(--line-soft);border-radius:3px;padding:2px 6px;
  text-transform:none;
}

/* --- Story media column (every story; earnings module excluded) --- */
.story.hasmedia{
  display:grid;grid-template-columns:1fr var(--media-w);gap:0 18px;align-items:start;
}
.story{--media-w:128px}
.story .storytext{min-width:0}
.story.lead{--media-w:152px;padding-top:20px;padding-bottom:20px;gap:0 20px}
.story.lead .headline{font-size:16.5px;line-height:1.34;margin-bottom:6px}
.storymedia{
  width:var(--media-w);aspect-ratio:3/2;border-radius:6px;overflow:hidden;
  border:1px solid var(--line);background:var(--accent-soft);
  display:flex;align-items:center;justify-content:center;position:relative;
}
.storymedia img{width:100%;height:100%;object-fit:cover;display:block}
.storymedia.tile{
  background-image:repeating-linear-gradient(135deg,rgba(48,86,200,.05) 0 1px,transparent 1px 7px);
}
.storymedia .tilefall{
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  width:100%;height:100%;padding:0 6px;text-align:center;
}
.storymedia.tile .tilefall{display:flex}
.story .body > :first-child{margin-top:0}
section.block{scroll-margin-top:58px}
.storymedia .tile-fig{
  font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;
  color:var(--accent);letter-spacing:-.02em;line-height:1;
}
.story.lead .tile-fig{font-size:23px}
.storymedia .tile-lbl{
  font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-faint);
}
.storymedia .tile-mono{
  font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;
  color:var(--accent);letter-spacing:.02em;line-height:1;
}
.story.lead .tile-mono{font-size:26px}
.story.lead .del{right:0;top:16px}

/* --- Manual image slot: click the tile to paste a URL --- */
.setimg{
  position:absolute;inset:0;width:100%;height:100%;
  border:none;background:none;cursor:pointer;opacity:0;
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);
  transition:opacity .15s;
}
.storymedia:hover .setimg{opacity:1;background:rgba(253,253,252,.82)}
.storymedia .imgurl{
  display:none;position:absolute;inset:auto 0 0 0;width:100%;
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--ink);
  border:none;border-top:1px solid var(--line);background:#fff;
  padding:5px 6px;outline:none;
}
.storymedia.editing .imgurl{display:block}
.storymedia.editing .setimg{display:none}
@media (hover:none){.setimg{display:none}}   /* no accidental taps on touch */

section.block.empty{display:none}

/* --- Earnings empty state --- */
.earn-empty{
  margin-top:14px;padding:20px;border:1px dashed var(--line);border-radius:8px;
  font-size:13px;color:var(--ink-faint);text-align:center;
}

@media (max-width:640px){
  .story{--media-w:84px}
  .story.hasmedia{gap:0 13px}
  .story.lead.hasmedia{grid-template-columns:1fr;gap:12px}
  .story.lead{--media-w:100%}
  .story.lead .storymedia{width:100%;aspect-ratio:16/7;order:-1}
  .story.lead .storytext{order:1}
  .sec-stat{display:none}
}
@media print{
  .secnav{display:none!important}
  .story:hover{box-shadow:none;background:none}
  .storymedia{break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .setimg,.storymedia .imgurl{display:none!important}
  .story{break-inside:avoid}
  .num,.story .why{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

@media (max-width:760px){
  .earn-snapshot{grid-template-columns:repeat(2,1fr)}
  .earn-snap-cell{border-left:none;border-top:1px solid var(--line-soft)}
  .earn-snap-cell:first-child{border-top:none}
  .kpi-row{grid-template-columns:repeat(2,1fr);row-gap:8px}
  .kpi{border-left:none;padding-left:0}
}
</style>

/* Every story now carries a media slot (the earnings module does not).
   The old failure mode — remote images that 404 and leave empty boxes in the
   PDF — is handled by the fallback tile: if s.img is missing, blank, or fails
   to load, the slot renders a monogram or the headline's key figure instead,
   so a slot is never empty. Set STORY_IMAGES=false to turn the column off. */
const STORY_IMAGES    = true;       // media slot beside every story
const IMAGE_FALLBACK = "hide";     // 'tile' = branded placeholder | 'hide' = story goes full width
/* REQUIRE_IMAGE governs LOAD FAILURES ONLY — a URL that arrived but 404s,
   hotlink-blocks, or is stripped as mixed content. Only the browser can know
   this, so it cannot be handled upstream. Stories that arrive with NO url are
   dropped earlier, by Briefing Render. Set false to keep them as tiles. */
const REQUIRE_IMAGE = false;       // remove a story whose image fails to load
const IMAGE_SECTIONS  = [];         // sections whose top story gets the larger .lead treatment
const MAX_LEAD_IMAGES = 1;          // how many top stories per section get the lead treatment
const DEDUPE_IMAGES   = true;       // if two stories resolve to the same artwork, only the first keeps it
const SHOW_FAVICONS   = true;       // source favicons in the meta line

/* Shown under the monogram when a story has no image, so the fallback tiles
   read as intentional rather than repetitive. */
const SECTION_TAG = {'1':'funding','2':'m&a','3':'market','4':'ai','5':'cyber','6':'research','7':'notable'};

/* Deal totals in the section header ("· $600M raised") are independent of
   imagery, so they keep their own list and survive the change above. */
const DEAL_STAT_SECTIONS = ['1','2'];
const DEAL_LABEL      = {'1':'raised','2':'deal value'};

const LABELS=['What happened:','Why it matters:','Key numbers:','Investor / operator lens:'];
const _usedImages = new Set();

/* Sample detection is automatic: a story is a placeholder if its headline still
   contains [bracketed] scaffold text. The n8n job no longer has to flip a flag. */
function isSample(o){return /\[[^\]]{1,60}\]/.test(String((o&&(o.h||o.name))||''));}

/* ---------- figure emphasis ---------- */
const FIG_RE=/(\$\s?\d[\d,]*(?:\.\d+)?\s?(?:million|billion|trillion|bn|[MBK])?\b|\b\d[\d,]*(?:\.\d+)?%|\b\d+(?:\.\d+)?\s?[×x](?=\s?(?:ARR|revenue|EBITDA|EV))|\bCVSS\s?\d+(?:\.\d+)?|\bCVE-\d{4}-\d{4,7})/g;
function markFigures(t){return String(t).replace(FIG_RE,m=>`<span class="num">${m}</span>`);}

/* ---------- body: label-aware segmentation ---------- */
function parseBody(text){
  text=String(text||'');
  let also='';
  const m=text.match(/\s*Also covered by:\s*(.+?)\.?\s*$/i);
  if(m){also=m[1].trim();text=text.slice(0,m.index);}
  const idx=[];
  LABELS.forEach(l=>{const i=text.indexOf(l);if(i>-1)idx.push({l,i});});
  idx.sort((a,b)=>a.i-b.i);
  const segs=[];
  if(!idx.length){segs.push({label:'',text:text.trim()});}
  else{
    if(idx[0].i>0)segs.push({label:'',text:text.slice(0,idx[0].i).trim()});
    idx.forEach((o,k)=>{
      const end=k+1<idx.length?idx[k+1].i:text.length;
      segs.push({label:o.l,text:text.slice(o.i+o.l.length,end).trim()});
    });
  }
  return {also,segs};
}
function bodyHTML(text){
  const {also,segs}=parseBody(text);
  const html=segs.map(s=>{
    const t=markFigures(s.text);
    if(!s.label)return `<div class="seg" contenteditable="true">${t}</div>`;
    const cls=(s.label==='Why it matters:')?'why':'seg';
    return `<div class="${cls}" contenteditable="true"><strong>${s.label}</strong> ${t}</div>`;
  }).join('');
  return {html,also};
}

/* ---------- lead media ---------- */
function dealFigure(h){
  const m=String(h).match(/\$\s?(\d[\d,]*(?:\.\d+)?)\s?(billion|million|trillion|bn|[MBK])?/i);
  if(!m)return null;
  const u=(m[2]||'').toLowerCase();
  const unit=u.startsWith('b')?'B':u.startsWith('t')?'T':u.startsWith('m')?'M':u==='k'?'K':'';
  return '$'+m[1].replace(/,/g,'')+unit;
}
function initials(h){
  const stop=/^(raises?|raised|acquires?|acquired|to|closes?|closed|secures?|lands?|buys?|takes?|announces?|launches?|nabs?)$/i;
  const out=[];
  for(const w of String(h).split(/\s+/)){if(stop.test(w.replace(/[^A-Za-z]/g,'')))break;out.push(w);}
  const parts=(out.join(' ')||String(h)).replace(/[^A-Za-z0-9 ]/g,'').trim().split(/\s+/).filter(Boolean);
  return ((parts[0]||'?')[0]+(parts[1]?parts[1][0]:'')).toUpperCase();
}
function imgFail(el){
  const box=el.parentNode;
  const manual=el.dataset.manual==='1';   // a hand-pasted URL never nukes the story
  el.remove();
  if(REQUIRE_IMAGE&&!manual){
    const st=box.closest('.story');
    if(st){st.remove();refreshCounts();return;}
  }
  box.classList.add('tile');
}

/* Story counts, deal totals, nav and the masthead stat are rendered once from
   SECTIONS. Anything that removes a story afterwards — a failed image, the ×
   button — has to put them back in sync. */
function refreshCounts(){
  let total=0;const srcs=new Set();
  SECTIONS.forEach(sec=>{
    const el=document.getElementById('sec'+sec.n);
    if(!el)return;
    const rows=Array.from(el.querySelectorAll('.story'));
    total+=rows.length;
    rows.forEach(r=>{if(r.dataset.src)srcs.add(r.dataset.src.toLowerCase());});
    const stat=el.querySelector('.sec-stat');
    if(stat){
      const n=rows.length;
      const bits=[`<b>${n}</b> ${n===1?'story':'stories'}`];
      if(DEAL_STAT_SECTIONS.indexOf(String(sec.n))>-1){
        const d=sumDeals(rows.map(r=>({h:(r.querySelector('.headline')||{}).textContent||''})));
        if(d)bits.push(`<b>${d}</b> ${DEAL_LABEL[String(sec.n)]||''}`);
      }
      stat.innerHTML=bits.join(' &nbsp;·&nbsp; ');
    }
    el.classList.toggle('empty',rows.length===0);
    const nav=document.querySelector('#secnav a[data-t="sec'+sec.n+'"]');
    if(nav)nav.style.display=rows.length?'':'none';
  });
  const st=document.getElementById('issueStat');
  if(st)st.textContent=`${total} stories · ${srcs.size} source${srcs.size===1?'':'s'}`;
}
function removeStory(btn){const s=btn.closest('.story');if(s){s.remove();refreshCounts();}}

/* Any headline figure worth putting on a tile — deal size first, then a
   percentage, then a CVSS score. Bracketed scaffold text yields none. */
function tileFigure(h){
  const d=dealFigure(h); if(d)return d;
  const p=String(h).match(/\b\d[\d,]*(?:\.\d+)?%/); if(p)return p[0];
  const c=String(h).match(/\bCVSS\s?(\d+(?:\.\d+)?)/i); if(c)return 'CVSS '+c[1];
  return null;
}
function storyMedia(s,secNum){
  let img=s.img?String(s.img).trim():'';
  if(img&&DEDUPE_IMAGES){if(_usedImages.has(img))img='';else _usedImages.add(img);}
  if(!img&&IMAGE_FALLBACK==='hide')return '';
  const fig=tileFigure(s.h);
  const lbl=DEAL_LABEL[String(secNum)]||SECTION_TAG[String(secNum)]||'';
  const tile=fig
    ? `<div class="tile-fig">${fig}</div><div class="tile-lbl">${lbl}</div>`
    : `<div class="tile-mono">${initials(s.h)}</div><div class="tile-lbl">${lbl}</div>`;
  return `<div class="storymedia${img?'':' tile'}">`
    + (img?`<img src="${img}" alt="" loading="lazy" onerror="imgFail(this)">`:'')
    + `<div class="tilefall">${tile}</div>`
    + `<button class="setimg" title="Set image URL" onclick="openImg(this)">+ image</button>`
    + `<input class="imgurl" type="url" placeholder="paste image URL, Enter" `
    + `onkeydown="if(event.key==='Enter'){this.blur()}if(event.key==='Escape'){this.dataset.cancel='1';this.blur()}" `
    + `onblur="commitImg(this)"></div>`;
}

/* ---------- manual image slot ---------- */
function openImg(btn){
  const box=btn.closest('.storymedia');
  box.classList.add('editing');
  const inp=box.querySelector('.imgurl');
  const cur=box.querySelector('img');
  inp.value=cur?cur.getAttribute('src'):'';
  delete inp.dataset.cancel;
  inp.focus();
}
/* Enter and click-away both save; only Escape discards. */
function commitImg(inp){
  const box=inp.closest('.storymedia');
  box.classList.remove('editing');
  if(inp.dataset.cancel){delete inp.dataset.cancel;return;}
  const url=inp.value.trim();
  const old=box.querySelector('img');
  if(old)old.remove();
  if(url){
    box.classList.remove('tile');
    box.insertAdjacentHTML('afterbegin',
      `<img src="${url.replace(/"/g,'&quot;')}" data-manual="1" alt="" loading="lazy" onerror="imgFail(this)">`);
  }else{
    box.classList.add('tile');
  }
}

/* ---------- meta ---------- */
function faviconHTML(src){
  if(!SHOW_FAVICONS||!src)return '';
  const d=String(src).replace(/^https?:\/\//,'').replace(/\/.*$/,'');
  return `<img class="favi" src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(d)}&sz=64" alt="" loading="lazy" onerror="this.remove()">`;
}

function storyHTML(s, sample, opts){
  opts=opts||{};
  const {html:body,also}=bodyHTML(s.b);
  const sourceLink=(s.src&&s.url)
    ? `<a href="${s.url}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;font-weight:600;">${s.src}</a>`
    : (s.src||'Source');
  const text=`<div class="headline" contenteditable="true" spellcheck="false">${markFigures(s.h)}</div>
    <div class="body">${body}</div>
    <div class="meta">${faviconHTML(s.src)}${sourceLink} · <span contenteditable="true">${s.d||'Date'}</span>${also?`<span class="also">also: ${also}</span>`:''}</div>`;
  const del=`<button class="del" title="Remove story" onclick="removeStory(this)">\u00d7</button>`;
  const dsrc=s.src?` data-src="${String(s.src).replace(/"/g,'&quot;')}"`:'';
  const media=STORY_IMAGES?storyMedia(s,opts.sec):'';
  const cls=`story${opts.lead?' lead':''}${media?' hasmedia':''}${sample?' sample':''}`;
  if(!media)return `<div class="${cls}"${dsrc}>${del}${text}</div>`;
  return `<div class="${cls}"${dsrc}>${del}<div class="storytext">${text}</div>${media}</div>`;
}

/* ---------- section stat ---------- */
function sumDeals(stories){
  let total=0,count=0;
  stories.forEach(s=>{
    const m=String(s.h||'').match(/\$\s?(\d[\d,]*(?:\.\d+)?)\s?(billion|million|trillion|bn|[MB])\b/i);
    if(!m)return;
    let v=parseFloat(m[1].replace(/,/g,''));const u=m[2].toLowerCase();
    if(u.startsWith('b'))v*=1000;else if(u.startsWith('t'))v*=1e6;
    total+=v;count++;
  });
  if(count<2)return '';
  return total>=1000?'$'+(total/1000).toFixed(total>=10000?0:1)+'B':'$'+Math.round(total)+'M';
}
function sectionStat(sec){
  const n=sec.stories.length;
  const bits=[`<b>${n}</b> ${n===1?'story':'stories'}`];
  if(DEAL_STAT_SECTIONS.indexOf(String(sec.n))>-1){
    const d=sumDeals(sec.stories);
    if(d)bits.push(`<b>${d}</b> ${DEAL_LABEL[String(sec.n)]||''}`);
  }
  return bits.join(' &nbsp;·&nbsp; ');
}
function blankStory(){
  return {h:'Headline — [who did what, with the key number]',
          b:'What happened: … Why it matters: … (3–5 sentences tying the facts to the theme).'};
}
document.getElementById('sections').innerHTML = SECTIONS.map(s=>`
  <section class="block" id="sec${s.n}">
    <div class="sechead">
      <span class="secnum">0${s.n}</span>
      <h2>${s.title}</h2>
      <span class="sec-stat">${sectionStat(s)}</span>
      <label class="omit-toggle"><input type="checkbox" onchange="this.closest('section').classList.toggle('omitted',this.checked)">omit</label>
    </div>
    <div class="stories">${s.stories.map((st,i)=>storyHTML(st,false,{
      lead: IMAGE_SECTIONS.indexOf(String(s.n))>-1 && i<MAX_LEAD_IMAGES,
      sec: s.n
    })).join('')}</div>
    <button class="addstory" onclick="addStory('sec${s.n}')">+ add story (target 3–5)</button>
    <div class="connective"><span class="lbl">Connective analysis</span>
      <p contenteditable="true">${s.c}</p></div>
  </section>`).join('');


/* ---------- Weekly Earnings Report render ---------- */
function kpiCell(label, value){
  const na = /^Not (Reported|Disclosed)/.test(String(value));
  return `<div class="kpi"><span class="k">${label}</span><span class="v${na?' na':''}" contenteditable="true">${value}</span></div>`;
}
function earnCardHTML(c, sample){
  return `<div class="earn-card${sample?' sample':''}">
    <button class="del" title="Remove company" onclick="this.parentNode.remove()">\u00d7</button>
    <div class="earn-meta" contenteditable="true" spellcheck="false">${c.name}<span class="sep">|</span>${c.date}<span class="sep">|</span>${c.period}<span class="sep">|</span>${c.segment}<span class="sep">|</span>${c.basis}</div>
    <div class="kpi-row">
      ${kpiCell('Revenue', c.kpis.revenue)}
      ${kpiCell('Adj. Op. Income / EBITDA', c.kpis.opIncome)}
      ${kpiCell('Adj. Op. Margin', c.kpis.opMargin)}
      ${kpiCell('FCF', c.kpis.fcf)}
      ${kpiCell('Adj. EPS', c.kpis.eps)}
    </div>
    <div class="earn-takeaway"><span class="lbl">Quarter takeaway</span>
      <ul>${c.takeaway.map(t=>`<li contenteditable="true">${t}</li>`).join('')}</ul>
    </div>
    <div class="earn-strategic"><span class="lbl">Strategic read</span>
      <ul>${c.strategic.map(t=>`<li contenteditable="true">${t}</li>`).join('')}</ul>
    </div>
    <div class="earn-watch" contenteditable="true"><strong>Watch Next:</strong> ${c.watch.replace(/^Watch Next:\s*/,'')}</div>
  </div>`;
}
function blankEarnCard(){
  return {name:'[Company]', date:'[Date]', period:'[Quarter]', segment:'[Segment]', basis:'[IFRS / US GAAP]',
    kpis:{revenue:'Not Reported', opIncome:'Not Reported', opMargin:'Not Reported', fcf:'Not Reported', eps:'Not Reported'},
    takeaway:[
      '[Guideline] State the headline result: what was reported vs. prior guidance/consensus.',
      '[Guideline] Identify the primary driver of the quarter (e.g., a specific segment, product, or cost line).',
      '[Guideline] Note whether the result beat, missed, or was in line \u2014 and by how much.'
    ],
    strategic:[
      '[Guideline] Explain why this result matters for the broader investment thesis or sector narrative.',
      '[Guideline] Note any relevant read-across to peers or adjacent categories.'
    ],
    watch:'Watch Next: \u2026'};
}
function addEarnCard(){
  const wrap=document.querySelector('#earningsSection .earn-cards');
  wrap.insertAdjacentHTML('beforeend', earnCardHTML(blankEarnCard(), false));
  wrap.lastElementChild.querySelector('.earn-meta').focus();
}
document.getElementById('earningsSection').innerHTML = `
  <section class="block" id="secEarnings">
    <div class="sechead">
      <span class="secnum">FIN</span>
      <h2>Weekly Earnings Report</h2>
      <label class="omit-toggle"><input type="checkbox" onchange="this.closest('section').classList.toggle('omitted',this.checked)">omit</label>
    </div>
    ${EARNINGS.companies.length?`<p class="earn-scope" contenteditable="true">${EARNINGS.scope}</p>`:''}
    <div class="earn-cards">${EARNINGS.companies.map(c=>earnCardHTML(c,false)).join('')}</div>
    ${EARNINGS.companies.length?'':'<div class="earn-empty">No tracked companies reported in this window.</div>'}
    <button class="addearncard" onclick="addEarnCard()">+ add company earnings card</button>
  </section>`;

function addStory(id){
  const sec=document.getElementById(id).querySelector('.stories');
  sec.insertAdjacentHTML('beforeend', storyHTML(blankStory(),false,{sec:String(id).replace(/^sec/,'')}));
  sec.lastElementChild.querySelector('.headline').focus();
}
function clearSamples(){
  document.querySelectorAll('.story.sample').forEach(e=>e.remove());
  document.querySelectorAll('.earn-card.sample').forEach(e=>e.remove());
}

/* ---------- Issue stats + section nav + scroll spy ---------- */
(function(){
  const all=SECTIONS.reduce((a,s)=>a.concat(s.stories),[]);
  const srcs=new Set(all.map(s=>String(s.src||'').toLowerCase()).filter(Boolean));
  const stat=document.getElementById('issueStat');
  if(stat) stat.textContent=`${all.length} stories · ${srcs.size} source${srcs.size===1?'':'s'}`;

  const nav=document.getElementById('secnav');
  if(!nav) return;
  let items=SECTIONS.map(s=>({id:'sec'+s.n,label:s.n+' '+s.title}));
  if(EARNINGS.companies.length) items.push({id:'secEarnings',label:'FIN Earnings'});
  nav.innerHTML=items.map(i=>`<a href="#${i.id}" data-t="${i.id}">${i.label}</a>`).join('');

  const links=Array.from(nav.querySelectorAll('a'));
  const byId={};links.forEach(a=>byId[a.dataset.t]=a);
  const targets=items.map(i=>document.getElementById(i.id)).filter(Boolean);
  if(!('IntersectionObserver' in window)||!targets.length) return;
  const vis=new Map();
  const io=new IntersectionObserver(es=>{
    es.forEach(e=>vis.set(e.target.id,e.isIntersecting?e.intersectionRatio:0));
    let best=null,bv=0;
    vis.forEach((v,k)=>{if(v>bv){bv=v;best=k;}});
    links.forEach(a=>a.classList.remove('active'));
    if(best&&byId[best]) byId[best].classList.add('active');
  },{rootMargin:'-58px 0px -55% 0px',threshold:[0,.15,.4,.75,1]});
  targets.forEach(t=>io.observe(t));
})();

/* Coverage window: pinned to run_date at render time. */
document.getElementById('weekRange').textContent = "14 Aug – 21 Aug 2026";
